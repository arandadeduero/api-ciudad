name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + E2E tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t api-ciudad:ci .

      - name: Docker smoke test
        run: |
          docker run -d --name api-ciudad-ci -p 3000:3000 -e NODE_ENV=production api-ciudad:ci
          npm run smoke-test
          docker logs api-ciudad-ci
          docker stop api-ciudad-ci
