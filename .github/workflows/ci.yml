name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + E2E tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t api-ciudad:ci .

      - name: Docker smoke test
        run: |
          docker run -d --name api-ciudad-ci -p 3000:3000 -e NODE_ENV=production api-ciudad:ci
          npm run smoke-test
          docker logs api-ciudad-ci
          docker stop api-ciudad-ci

  # Publica la imagen en GitHub Container Registry solo cuando build-and-test
  # pasa en `main` (nunca en PRs) — así nunca se publica una imagen rota.
  # El paquete se crea PRIVADO por defecto (comportamiento de GHCR, no
  # depende de la visibilidad del repo): hace falta un cambio manual único
  # en la UI de GitHub (package settings → Danger Zone → Change visibility)
  # para hacerlo público a partir de la primera publicación.
  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
